name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\QuickTranslate.csproj -r win-x64

      - name: Build
        run: >-
          dotnet build .\QuickTranslate.csproj
          -c Release
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          --no-restore

      - name: Publish
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1 -Version "1.0.0"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: QuickTranslate-win-x64
          path: artifacts/QuickTranslate-v1.0.0-win-x64.zip
          if-no-files-found: error
