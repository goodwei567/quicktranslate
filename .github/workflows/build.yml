name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(?<version>.+)$') {
            $Matches.version
          } else {
            '1.2.0'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\QuickTranslate.csproj -r win-x64

      - name: Build
        run: >-
          dotnet build .\QuickTranslate.csproj
          -c Release
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          --no-restore

      - name: Publish
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: QuickTranslate-win-x64
          path: artifacts/QuickTranslate-v${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $notesPath = ".github/release-notes/${{ github.ref_name }}.md"
          $archivePath = "artifacts/QuickTranslate-v${{ steps.version.outputs.version }}-win-x64.zip"
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          $body = Get-Content -LiteralPath $notesPath -Raw
          $body += "`n`nSHA-256: ``$hash``"
          Set-Content -LiteralPath "artifacts/release-body.md" -Value $body -Encoding utf8

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: QuickTranslate ${{ github.ref_name }}
          body_path: artifacts/release-body.md
          files: artifacts/QuickTranslate-v${{ steps.version.outputs.version }}-win-x64.zip
          fail_on_unmatched_files: true
